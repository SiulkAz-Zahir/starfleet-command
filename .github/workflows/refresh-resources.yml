name: Refresh learning resources

# Runs on GitHub's free-tier hosted runners. Public repos get
# effectively unlimited free Actions minutes; private repos get a
# generous free monthly quota. Either way this tiny job costs
# nothing for a personal project.
on:
  schedule:
    - cron: "0 12 * * *"   # once a day at 12:00 UTC
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install script dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run refresh script
        run: python scripts/refresh_resources.py

      - name: Commit updated resources.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data/resources.json
          git diff --cached --quiet || git commit -m "chore: refresh resources.json [automated]"
          git push
